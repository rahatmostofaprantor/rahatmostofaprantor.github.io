<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal website</title>

<meta name="description" content="Personal website.">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- Styles -->
<link rel="stylesheet" href="site/styles.css">
</head>
<body class="home-page">
<nav class="topbar" data-site-nav></nav>

<header class="hero">
<div class="container">
<h1 id="aboutTitle">About</h1>
</div>
</header>

<main>
<section class="intro-section">
<div class="container hero-layout">
<div class="hero-copy">
<p class="subtitle" id="aboutBio"></p>
<div class="about-contact" id="aboutContact"></div>
</div>
<img class="profile-pic" id="profileImage" src="assets/images/Profile.jpg" alt="Profile photo">
</div>
</section>

<section class="news-section container" aria-labelledby="news-title">
<h2 id="news-title">News</h2>
<div class="news-scroll" id="homeNewsList" aria-label="Recent news" aria-live="polite"></div>
<p class="news-more"><a href="pages/news.html">View all news</a></p>
</section>

<nav class="quick-links container" aria-label="Explore sections">
<a class="quick-link-pill" href="pages/projects.html">Projects</a>
<a class="quick-link-pill" href="pages/publications.html">Publications</a>
<a class="quick-link-pill" href="pages/cv.html">Curriculum Vitae</a>
</nav>
</main>

<section class="connect-band">
<div class="container">
<h2>Connect with <span data-site-field="name"></span></h2>
<div class="social-links" id="socialLinks" aria-label="Social links"></div>
</div>
</section>

<footer class="site-footer" data-site-footer></footer>

<script src="site/script.js"></script>
<script src="site/news.js"></script>
</body>
</html>
